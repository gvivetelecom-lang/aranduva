function cardArticle(a){return `<article class="card"><span class="tag">${escapeHTML(a.area)}</span><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.summary)}</p><div class="meta">✍️ ${escapeHTML(a.author)} · 👁 ${a.views} lecturas</div><button class="link" onclick="navigate('articles','${a.id}')">Leer artículo ↗</button></article>`};function courseCard(c){return `<article class="card"><div class="thumb">${c.area==='Salud'?'🩺':c.area==='Tecnología'?'💻':'📖'}</div><div class="meta"><span class="tag">${escapeHTML(c.area)}</span><span>👁 ${c.views}</span></div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.teacher)}<br>${escapeHTML(c.univ)}</p><button class="btn alt sm" onclick="navigate('courses','${c.id}')">Explorar curso →</button></article>`};function liveCard(l){return `<article class="card"><span class="tag ${l.status==='live'?'live':l.status==='soon'?'soon':''}">${l.status==='live'?'🔴 En vivo':l.status==='soon'?'⏰ En 10 minutos':'📆 Programado'}</span><h3>${escapeHTML(l.title)}</h3><p>🎙 ${escapeHTML(l.speaker)}<br>📍 ${escapeHTML(l.city)}</p><button class="btn sm" onclick="navigate('lives','${l.id}')">${l.status==='live'?'Entrar al vivo':'Ver detalles'} →</button></article>`};

ass="card"><span class="tag">Recién publicado</span>${cardMini(data.articles[2])}</div></div></div><div class="notice"><b>🔎 Demo para concurso.</b> Los artículos, universidades, usuarios, cursos y eventos son ejemplos ficticios. La interfaz demuestra flujos y permisos sin una infraestructura institucional real.</div>`};function cardMini(a){return `<h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.summary)}</p><button class="link" onclick="navigate('articles','${a.id}')">Leer artículo →</button>`};
function filterUI(kind){let fields=kind==='articles'?['Buscar artículo o autor','Área','Ciudad','Ordenar']:kind==='courses'?['Buscar curso o docente','Área','Ciudad','Ordenar']:kind==='events'?['Buscar evento o disertante','Área','Ciudad','Ordenar']:['Buscar transmisión','Área','Ciudad','Ordenar'];let areas=['Todas las áreas','Tecnología','Humanidades','Salud','Ciencias naturales'];let cities=['Todas las ciudades','Asunción','Ciudad del Este','Encarnación','Concepción'];return `<div class="filterbar"><div class="field"><label>${fields[0]}</label><input id="fsearch" placeholder="Buscar..." value="${escapeHTML(S.filters.search||'')}" oninput="updateFilter('search',this.value)"></div><div class="field"><label>${fields[1]}</label><select onchange="updateFilter('area',this.value)">${areas.map((x,i)=>`<option value="${i?x:''}" ${S.filters.area===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${fields[2]}</label><select onchange="updateFilter('city',this.value)">${cities.map((x,i)=>`<option value="${i?x:''}" ${S.filters.city===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${fields[3]}</label><select onchange="updateFilter('order',this.value)"><option value="recent">Más recientes</option><option value="popular" ${S.filters.order==='popular'?'selected':''}>Más populares</option><option value="az" ${S.filters.order==='az'?'selected':''}>Título A–Z</option></select></div></div>`};function updateFilter(k,v){S.filters[k]=v;const dest=document.getElementById('filtered');if(dest)dest.innerHTML=filteredContent(S.page)};function getFiltered(kind){let arr=[...(data[kind]||[])];return arr.filter(x=>(x.published!==false)&&x.status!=='finished'&&(!S.filters.area||x.area===S.filters.area)&&(!S.filters.city||x.city===S.filters.city)&&(!S.filters.search||JSON.stringify(x).toLowerCase().includes(S.filters.search.toLowerCase()))).sort((a,b)=>S.filters.order==='popular'?(b.views||b.enrolled||0)-(a.views||a.enrolled||0):S.filters.order==='az'?a.title.localeCompare(b.title):(b.date||'').localeCompare(a.date||''))};function filteredContent(kind){const items=getFiltered(kind);return items.length?`<div class="grid">${items.map(x=>kind==='articles'?cardArticle(x):kind==='courses'?courseCard(x):kind==='events'?`<div class="card"><span class="tag">${x.date} · ${x.time}</span><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.speaker)} · ${escapeHTML(x.city)}</p><button class="btn alt sm" onclick="toast('Evento agregado al calendario demostrativo')">Añadir recordatorio ♡</button></div>`:liveCard(x)).join('')}</div>`:'<div class="empty">Mainu no encontró resultados con esos filtros. Probá otra combinación. 🐦</div>'};
function directory(kind){let config={articles:['Biblioteca científica','Investigaciones abiertas a toda la comunidad. Referencias en formato APA 7.'],courses:['Directorio de cursos','Formación académica autorizada para usuarios institucionales.'],events:['Calendario académico','Conferencias, encuentros y actividades universitarias.'],lives:['Foro de en vivos','Encuentros académicos con chat y participación regulada.']}[kind];return `<div class="pagehead"><span class="eyebrow">ARANDUVA / Explorador</span><h1>${config[0]}</h1><p>${config[1]}</p></div>${filterUI(kind)}<div class="small" style="margin:10px 0">Contenido ilustrativo · Podés combinar filtros y ordenar resultados.</div><div id="filtered">${filteredContent(kind)}</div>`};

function courseDetail(){const c=data.courses.find(x=>x.id===S.chosen)||data.courses[0];return `<button class="back" onclick="navigate('courses')">← Directorio de cursos</button><div class="hero" style="padding:30px"><div><span class="tag">Curso de demostración</span><h1>${escapeHTML(c.title)}</h1><p>${escapeHTML(c.teacher)} · ${escapeHTML(c.univ)}</p><button class="btn" onclick="toast('Inscripción simulada realizada')">Inscribirme (demo)</button></div><div style="font-size:76px">🎓</div></div><div class="section grid two"><div class="card"><h3>Contenido del curso</h3><p>Unidad 1: Introducción y conceptos fundamentales.</p><p>Unidad 2: Métodos y ejemplos de aplicación.</p><p>Unidad 3: Actividad de reflexión y evaluación.</p><button class="btn alt" onclick="toggleMainu(true);askMainu('Ayudame a estudiar este curso')">Pedir guía a Mainu 🐦</button></div><div class="card"><h3>Investigaciones relacionadas</h3>${data.articles.filter(a=>a.area===c.area).map(a=>`<p><button class="link" onclick="navigate('articles','${a.id}')">📄 ${escapeHTML(a.title)} ↗</button></p>`).join('')}</div></div>`};

function renderComment(x){return `<div class="chatmsg ${x.guest?'guest':''} ${x.pin?'pin':''}"><strong>${x.pin?'📌 ':''}${escapeHTML(x.who)}</strong><div>${escapeHTML(x.text)}</div>${S.role==='admin'||S.role==='listener'?`<button class="link" style="font-size:11px;padding:1px" onclick="pinComment(${S.liveComments.indexOf(x)})">${x.pin?'Desanclar':'Anclar'}</button>`:''}</div>`};function pinComment(i){S.liveComments[i].pin=!S.liveComments[i].pin;render()};function sendChat(){const input=document.getElementById('chat-input');let val=input?.value.trim();if(!val)return;S.liveComments.push({who:roleLabel(),text:val,guest:S.role==='listener'&&S.requests<0});render()};function liveDetail(){let l=data.lives.find(x=>x.id===S.chosen)||data.lives[0];return `<button class="back" onclick="navigate('lives')">← Programación de en vivos</button><div class="pagehead"><span class="tag ${l.status==='live'?'live':'soon'}">${l.status==='live'?'🔴 En vivo':l.time}</span><h1 style="margin-top:12px">${escapeHTML(l.title)}</h1><p>${escapeHTML(l.speaker)} · ${escapeHTML(l.city)} · Demostración</p></div><div class="live-layout"><div><div class="video"><div><div style="font-size:49px">🎥</div><h3>Transmisión simulada</h3><p style="color:#d2e9ee">${escapeHTML(l.speaker)} · Sala de prueba</p><button class="btn alt sm" onclick="S.playing=!S.playing;render()">${S.playing?'⏸ Pausar':'▶ Iniciar'} ejemplo</button></div><div class="subtitles">${S.sub==='es'?'Bienvenidos a este encuentro académico.':'Bem-vindos a este encontro acadêmico.'}</div></div><div class="toolbar"><label class="small">Subtítulos:</label><button class="chip" onclick="S.sub='es';render()">ES</button><button class="chip" onclick="S.sub='pt';render()">PT</button><button class="chip" onclick="toggleMainu(true);askMainu('¿Qué explicó la ponente en este video?')">🐦 Preguntale a Mainu</button></div><div class="card"><h3>Participación</h3><div class="toolbar">${S.role==='admin'?`<button class="btn sm" onclick="inviteGuest()">🔗 Generar invit function adminPage(){const uni=[{name:'Universidad Católica · Alto Paraná',logo:'assets/uc_alto_parana.jpeg',users:812,enrolled:326,courses:14,articles:22,lives:8,city:'Ciudad del Este'},{name:'Universidad Privada del Este',logo:'assets/upe_cde.jpeg',users:967,enrolled:408,courses:19,articles:17,lives:11,city:'Ciudad del Este'},{name:'UNINTER · Universidad Internacional Tres Fronteras',logo:'assets/uninter.jpeg',users:671,enrolled:281,courses:12,articles:13,lives:7,city:'Ciudad del Este'}];const totalUsers=uni.reduce((a,b)=>a+b.users,0),totalEnrolled=uni.reduce((a,b)=>a+b.enrolled,0),totalCourses=uni.reduce((a,b)=>a+b.courses,0),totalArticles=uni.reduce((a,b)=>a+b.articles,0),totalLives=uni.reduce((a,b)=>a+b.lives,0);return `<div class="pagehead"><span class="eyebrow">Panel institucional · Demo</span><h1>Administración universitaria y analíticas</h1><p>Visualización de cómo ARANDUVA permitiría medir el funcionamiento general de la aplicación, por institución y por tipo de contenido.</p></div><div class="notice" style="margin-bottom:20px"><b>🧭 Procedimientos y control</b><p>Desde aquí una autoridad puede revisar el estado general de la plataforma, mientras que el sector docente demuestra cómo se crean cursos, se programan vivos y se inscriben alumnos.</p><button class="btn sm" onclick="navigate('teacher')">Abrir procedimientos docentes →</button><button class="btn alt sm" style="margin-left:8px" onclick="S.teacherStep='enroll';navigate('teacher')">Inscribir alumno →</button></div><div class="grid">${[[totalUsers.toLocaleString('es-PY'),'Usuarios autenticados'],[totalEnrolled.toLocaleString('es-PY'),'Alumnos inscritos en cursos'],[totalCourses.toLocaleString('es-PY'),'Cursos publicados'],[totalArticles.toLocaleString('es-PY'),'Artículos publicados'],[totalLives.toLocaleString('es-PY'),'En vivos registrados'],['1.684','Consultas realizadas a Mainu']].map(x=>`<div class="stat"><strong>${x[0]}</strong><span class="small">${x[1]}</span></div>`).join('')}</div><div class="section"><div class="section-head"><h2>Universidades integradas en la demo</h2><button class="link" onclick="toast('Comparativa exportada de forma simulada')">Exportar comparativa</button></div><div class="grid">${uni.map(u=>`<div class="card"><div class="row" style="align-items:flex-start;gap:14px"><img src="${u.logo}" alt="Logo de ${u.name}" style="width:84px;height:84px;object-fit:contain;border-radius:14px;border:1px solid var(--line);padding:8px;background:white"><div style="min-width:0"><h3 style="margin-top:0">${u.name}</h3><div class="small">📍 ${u.city}</div><div class="pillrow" style="margin-top:8px"><span class="tag navy">${u.users} autenticados</span><span class="tag">${u.enrolled} inscritos</span></div></div></div><div class="grid two" style="margin-top:14px"><div class="stat"><strong>${u.courses}</strong><span class="small">Cursos publicados</span></div><div class="stat"><strong>${u.articles}</strong><span class="small">Artículos publicados</span></div><div class="stat"><strong>${u.lives}</strong><span class="small">En vivos</span></div><div class="stat"><strong>${Math.round(u.enrolled/u.courses)}</strong><span class="small">Promedio de alumnos por curso</span></div></div><div class="toolbar"><button class="btn alt sm" onclick="toast('Ficha institucional de ${u.name} abierta en modo demostración')">Ver detalle institucional</button></div></div>`).join('')}</div></div><div class="section grid two"><div class="card"><h3>📈 Distribución por tipo de contenido</h3><p class="small">Cantidad de publicaciones y actividades visibles para las instituciones integradas.</p><div class="stat">Cursos<div style="height:9px;background:#e0ebeb;border-radius:9px;margin-top:6px"><div style="width:82%;background:var(--teal);height:100%;border-radius:9px"></div></div><div class="small">${totalCourses} publicados</div></div><div class="stat" style="margin-top:10px">Artículos<div style="height:9px;background:#e0ebeb;border-radius:9px;margin-top:6px"><div style="width:68%;background:var(--turq);height:100%;border-radius:9px"></div></div><div class="small">${totalArticles} publicados</div></div><div class="stat" style="margin-top:10px">En vivos<div style="height:9px;background:#e0ebeb;border-radius:9px;margin-top:6px"><div style="width:49%;background:var(--emerald);height:100%;border-radius:9px"></div></div><div class="small">${totalLives} registrados</div></div></div><div class="card"><h3>👥 Usuarios autenticados por universidad</h3><p class="small">Comparativa de cuentas activas registradas en la plataforma.</p>${uni.map(u=>`<div style="margin:12px 0"><div class="row space"><b style="font-size:13px">${u.name.split('·')[0].trim()}</b><span class="small">${u.users}</span></div><div style="height:10px;background:#e0ebeb;border-radius:99px;margin-top:6px"><div style="width:${Math.round((u.users/1000)*100)}%;max-width:100%;background:linear-gradient(90deg,var(--navy),var(--teal));height:100%;border-radius:99px"></div></div></div>`).join('')}</div><div class="card"><h3>🎓 Inscripciones y actividad académica</h3><p>Las instituciones con mayor volumen de inscripciones también concentran la mayor participación en cursos de tecnología y salud.</p><div class="grid two"><div class="stat"><strong>74%</strong><span class="small">Asistencia promedio a cursos</span></div><div class="stat"><strong>61%</strong><span class="small">Finalización estimada</span></div><div class="stat"><strong>38%</strong><span class="small">Participación en en vivos</span></div><div class="stat"><strong>4,2/5</strong><span class="small">Satisfacción de prueba</span></div></div></div><div class="card"><h3>🤖 IA y uso de Mainu</h3><p>Mainu ayuda a encontrar artículos, explicar videos y orientar búsquedas. Esta tarjeta permite visualizar la adopción del asistente.</p><div class="grid two"><div class="stat"><strong>1.684</strong><span class="small">Consultas de Mainu</span></div><div class="stat"><strong>87%</strong><span class="small">Respuestas útiles</span></div><div class="stat"><strong>56%</strong><span class="small">Preguntas sobre artículos</span></div><div class="stat"><strong>28%</strong><span class="small">Preguntas sobre grabaciones</span></div></div></div><div class="card"><h3>✦ Clasificación asistida por IA</h3><p>Artículo: «Tecnologías abiertas y educación superior»</p><div class="pillrow"><span class="tag">Tecnología</span><span class="tag">Educación</span><span class="tag">Acceso abierto</span></div><div class="toolbar"><button class="btn sm" onclick="toast('Categorías aprobadas en esta demo')">Aprobar sugerencias</button><button class="btn alt sm" onclick="toast('Edición de categorías simulada')">Editar</button></div></div><div class="card"><h3>📄 Resumen pendiente</h3><p>Mainu preparó un resumen de ejemplo para una conferencia. El administrador decide si publicarlo para los usuarios autorizados.</p><button class="btn sm" onclick="S.modal='summary';render()">Revisar resumen →</button></div><div class="card"><h3>🏫 Integración escolar</h3><p>Permite habilitar colegios, coordinadores, cupos y cursos autorizados para estudiantes de educación media.</p><button class="btn alt sm" onclick="navigate('school')">Ver coordinación escolar →</button></div><div class="card"><h3>📝 Resumen ejecutivo</h3><p class="small">En esta simulación, la Universidad Privada del Este presenta el mayor número de usuarios autenticados y cursos publicados. La Universidad Católica Alto Paraná concentra una biblioteca científica más robusta, mientras que UNINTER muestra un desempeño parejo en cursos y transmisiones.</p><div class="pillrow"><span class="tag navy">Datos ficticios</span><span class="tag">Comparativa institucional</span><span class="tag">Demo de analíticas</span></div></div></div>`};function schoolPage(){return `<div class="pagehead"><span class="eyebrow">Acceso institucional de demostración</span><h1>Coordinación escolar</h1><p>El coordinador puede gestionar estudiantes solo dentro de los cursos autorizados por una universidad.</p></div><div class="notice">Colegio de demostración · Acceso limitado a «Programación desde cero». Ninguna institución real está vinculada.</div><div class="section grid two"><div class="card"><h3>Curso habilitado</h3><p>💻 Programación desde cero</p><p>Universidad Demo del Este</p><button class="btn alt sm" onclick="navigate('courses','c4')">Ver curso</button></div><div class="card"><h3>Estudiantes autorizados</h3><p>15 alumnos de ejemplo</p><button class="btn sm" onclick="toast('Invitación ficticia generada para un alumno')">+ Crear acceso de demostración</button></div></div>`};
function modal(){if(!S.modal)return '';if(S.modal==='login')return `<div class="modal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal"><button class="modal-close" onclick="S.modal=null;render()">✕</button><h2>🔒 Acceso institucional</h2><p class="small">Elegí un rol de prueba. La demo no necesita cédula, matrícula ni contraseña auténtica.</p><div class="roles">${[['teacher','👩‍🏫 Docente universitario'],['student','🎓 Estudiante universitario'],['admin','🛡️ Administrador universitario'],['coordinator','🏫 Coordinador de colegio'],['schoolstudent','📖 Estudiante de colegio'],['listener','🎧 Oyente autenticado']].map(x=>`<button class="role" onclick="setRole('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="notice">Todos los accesos son ficticios. Los permisos reales requieren autenticación segura en una implementación futura.</div></div></div>`;if(S.modal==='summary')return `<div class="modal-bg"><div class="modal"><button class="modal-close" onclick="S.modal=null;render()">✕</button><h2>📄 Revisión académica</h2><p class="small">Borrador simulado producido por IA.</p><div class="card" style="margin:15px 0"><b>Resumen: investigación abierta</b><p>Se conversó sobre el acceso a contenidos universitarios, la importancia de citar fuentes y la cooperación entre instituciones. Se recomendó evaluar los resultados antes de ampliar el sistema.</p><b>Preguntas agrupadas:</b><p>1. ¿Cómo se publican materiales?<br>2. ¿Quién puede acceder a grabaciones?<br>3. ¿Cómo se verifican fuentes?</p></div><label><input type="checkbox" id="summary-check"> Revisé el contenido y autorizo su publicación.</label><div class="toolbar"><button class="btn" onclick="if(document.getElementById('summary-check').checked){S.approved=true;S.modal=null;render();toast('Resumen de ejemplo aprobado')}else toast('Primero revisá y marcá la autorización')">Publicar resumen</button><button class="btn alt" onclick="S.modal=null;render()">Cancelar</button></div></div></div>`;return ''};
function mainuReply(q){let s=q.toLowerCase();let art=data.articles.find(x=>S.page==='articles'&&x.id===S.chosen);if(s.includes('citar')||s.includes('apa'))return art?`Para citar este artículo de demostración, podés utilizar sus datos: ${art.author} (2026), «${art.title}». Recordá comprobar los metadatos antes de usar cualquier referencia en una investigación real.`:'Para citar un artículo en APA 7 necesitás autor, año, título y fuente. Abrí un artículo de la biblioteca y te muestro un ejemplo con sus datos.';if(s.includes('video')||s.includes('grabación')||s.includes('ponente'))return 'En nuestra grabación de ejemplo se explica que la tecnología puede acompañar el aprendizaje. Cuando conectemos transcripciones reales, podré señalar el minuto exacto de cada explicación.';if(s.includes('curso'))return 'Podés entrar al directorio de cursos desde el menú. Allí filtrás por carrera, área o ciudad. Si querés, empezá por «Introducción a la inteligencia artificial».';if(s.includes('resum')||s.includes('explic')||s.includes('entender'))return art?`¡Claro! Este artículo trata sobre ${art.title.toLowerCase()}. En palabras simples: ${art.summary} No olvides que este artículo es ficticio y se utiliza para mostrar cómo te acompañaría.`:'¡Claro! La idea principal del ejemplo es que compartir materiales académicos ayuda a que más personas aprendan. Puedo explicar un párrafo específico si abrís un artículo.';if(s.includes('artículo')||s.includes('investiga')||s.includes('buscar'))return 'La biblioteca científica es abierta. Podés buscar por autor, área, ciudad o título. Como ejemplo, te recomiendo explorar los artículos sobre tecnología y educación.';return '¡Buena pregunta! 🐦 Soy Mainu en versión demostrativa, así que por ahora respondo con ejemplos preparados. En la versión oficial podré consultar artículos y transcripciones reales, respetando tus permisos. Probá preguntarme por cursos, artículos o citas APA.'};function askMainu(q){S.mainuMessages.push({who:'user',text:q});S.mainuMood='thinking';render();setTimeout(()=>{S.mainuMessages.push({who:'ai',text:mainuReply(q)});S.mainuMood='happy';render();let z=document.querySelector('.mainu-body');if(z)z.scrollTop=z.scrollHeight},320)};function submitMainu(){let i=document.getElementById('mainu-input');if(i&&i.value.trim())askMainu(i.value.trim())};function toggleMainu(v){S.chatOpen=typeof v==='boolean'?v:!S.chatOpen;render()};function mainuUI(){return `<button class="mainu-launch" aria-label="Abrir asistente Mainu" onclick="toggleMainu()">${bird(S.mainuMood)}</button>${S.chatOpen?`<div class="mainu-chat"><div class="mainu-head">${bird(S.mainuMood)}<div style="flex:1"><b>Mainu</b><div style="font-size:11px;color:#bbeddf">Tu compañero académico · Demo</div></div><button style="background:none;color:white;border:0;font-size:22px" onclick="toggleMainu(false)">×</button></div><div class="mainu-body">${S.mainuMessages.map(m=>`<div class="bubble ${m.who==='ai'?'ai':'user'}">${escapeHTML(m.text)}</div>`).join('')}<div class="pillrow" style="margin-top:12px"><button class="chip" onclick="askMainu('Explicame este contenido')">Explicame</button><button class="chip" onclick="askMainu('¿Cómo cito en APA?')">Citar en APA</button><button class="chip" onclick="askMainu('Buscá artículos')">Buscar artículos</button></div></div><div class="mainu-compose"><input class="input" id="mainu-input" placeholder="Preguntale a Mainu..." onkeydown="if(event.key==='Enter')submitMainu()"><button class="btn sm" onclick="submitMainu()">➤</button></div></div>`:''}`};function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Copiado al portapapeles')).catch(()=>toast('No se pudo copiar automáticamente'))}else{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Copiado al portapapeles')}};

function fieldVal(form,name){return (new FormData(form).get(name)||'').toString().trim()}
function addLog(text){S.teacherLog.unshift({text,date:new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})});S.teacherLog=S.teacherLog.slice(0,8)}
function teacherSwitch(step){S.teacherStep=step;render()}
function createCourse(form){const title=fieldVal(form,'title'),teacher=fieldVal(form,'teacher'),area=fieldVal(form,'area'),city=fieldVal(form,'city');if(!title||!teacher){toast('Completá título y nombre del docente');return false}let course={id:'demo-c'+Date.now(),title,teacher,area,city,univ:'Universidad de demostración',enrolled:0,views:0,level:fieldVal(form,'level')||'Universitario',published:false,description:fieldVal(form,'description')};data.courses.unshift(course);S.createdCourses.unshift(course.id);addLog('Borrador de curso creado: '+title);toast('Curso guardado como borrador');S.teacherStep='publish';render();return false}
function publishCourse(id){const c=data.courses.find(x=>x.id===id);if(!c)return;c.published=true;addLog('Curso publicado: '+c.title);toast('Curso publicado: ahora aparece en el directorio');render()}
function scheduleLive(form){const title=fieldVal(form,'title'),speaker=fieldVal(form,'speaker'),date=fieldVal(form,'date'),time=fieldVal(form,'time');if(!title||!speaker||!date||!time){toast('Completá todos los campos obligatorios');return false}const l={id:'demo-l'+Date.now(),title,speaker,area:fieldVal(form,'area'),city:fieldVal(form,'city'),date,time,status:'future',viewers:0,published:false,started:false};data.lives.unshift(l);S.createdLives.unshift(l.id);addLog('Transmisión programada: '+title);toast('En vivo creado como borrador');S.teacherStep='livePublish';render();return false}
function publishLive(id){let l=data.lives.find(x=>x.id===id);if(!l)return;l.published=true;addLog('Programación publicada: '+l.title);toast('En vivo publicado en el foro');render()}
function startLive(id){let l=data.lives.find(x=>x.id===id);if(!l)return;if(!l.published){toast('Primero publicá el en vivo');return}l.status='live';l.time='Ahora';l.started=true;addLog('Transmisión simulada iniciada: '+l.title);S.teacherStep='liveStart';toast('Sala de prueba iniciada');render()}
function finishLive(id){let l=data.lives.find(x=>x.id===id);if(!l)return;l.status='finished';l.time='Finalizado';addLog('Transmisión de ejemplo finalizada: '+l.title);toast('Transmisión finalizada');render()}
function enrollStudent(form){let courseId=fieldVal(form,'course'),student=fieldVal(form,'student'),code=fieldVal(form,'code');if(!student||!code||!courseId){toast('Completá los datos de prueba');return false}const course=data.courses.find(x=>x.id===courseId);if(!course){toast('Seleccioná un curso válido');return false}if(S.enrollments.some(x=>x.code===code&&x.courseId===courseId)){toast('Este alumno ya está inscripto a ese curso');return false}S.enrollments.unshift({student,code,courseId,course:course.title});course.enrolled++;addLog('Alumno de prueba inscripto: '+student);toast('Inscripción registrada en la demo');render();return false}
function teacherCourseForm(){return `<div class="card"><h3>1 · Crear curso</h3><p>El docente prepara la ficha académica. La publicación ocurre después de la revisión y confirmación.</p><form onsubmit="return createCourse(this)"><div class="workflow-fields"><div class="field wide"><label>Título del curso *</label><input name="title" required maxlength="110" placeholder="Ej.: Introducción a la investigación científica"></div><div class="field"><label>Docente responsable *</label><input name="teacher" required value="Prof. Alex Demo" maxlength="70"></div><div class="field"><label>Área</label><select name="area"><option>Tecnología</option><option>Salud</option><option>Humanidades</option><option>Ciencias Sociales</option></select></div><div class="field"><label>Ciudad</label><select name="city"><option>Asunción</option><option>Ciudad del Este</option><option>Encarnación</option><option>Otra ciudad</option></select></div><div class="field"><label>Nivel</label><select name="level"><option>Universitario</option><option>Nivel medio</option></select></div><div class="field wide"><label>Descripción del curso</label><textarea name="description" rows="3" placeholder="Qué aprenderán los estudiantes"></textarea></div></div><div class="toolbar"><button class="btn" type="submit">Guardar borrador del curso →</button></div></form></div>`}
function teacherPublishCourse(){let candidates=data.courses.filter(x=>S.createdCourses.includes(x.id));return `<div class="card"><h3>2 · Revisar y publicar curso</h3><p>Revisá el borrador y elegí «Publicar». Podés comprobar el resultado en el directorio de cursos.</p>${candidates.length?`<div class="demo-list">${candidates.map(c=>`<div class="demo-item"><div class="row space"><b>${escapeHTML(c.title)}</b><span class="tag ${c.published?'status-published':'status-draft'}">${c.published?'Publicado':'Borrador'}</span></div><p>${escapeHTML(c.teacher)} · ${escapeHTML(c.area)} · ${escapeHTML(c.city)}</p><div class="toolbar">${c.published?`<button class="btn alt sm" onclick="navigate('courses','${c.id}')">Ver publicación →</button>`:`<button class="btn sm" onclick="publishCourse('${c.id}')">Publicar curso</button>`}</div></div>`).join('')}</div>`:`<div class="empty">Todavía no creaste cursos nuevos. Comenzá en «Crear curso».</div><button class="btn alt sm" onclick="teacherSwitch('course')">Crear uno ahora</button>`}</div>`}
function teacherLiveForm(){return `<div class="card"><h3>3 · Programar un en vivo</h3><p>El docente carga título, disertante, fecha y horario. Luego podrá publicar la programación y abrir la sala.</p><form onsubmit="return scheduleLive(this)"><div class="workflow-fields"><div class="field wide"><label>Título de la conferencia *</label><input name="title" required maxlength="110" placeholder="Ej.: Encuentro de investigación universitaria"></div><div class="field"><label>Disertante *</label><input name="speaker" required value="Prof. Alex Demo" maxlength="80"></div><div class="field"><label>Área académica</label><select name="area"><option>Tecnología</option><option>Salud</option><option>Humanidades</option><option>Ciencias Sociales</option></select></div><div class="field"><label>Ciudad</label><select name="city"><option>Asunción</option><option>Ciudad del Este</option><option>Encarnación</option></select></div><div class="field"><label>Fecha *</label><input name="date" type="date" required value="2026-11-12"></div><div class="field"><label>Hora *</label><input name="time" type="time" required value="18:00"></div></div><div class="toolbar"><button class="btn" type="submit">Guardar programación →</button></div></form></div>`}
function teacherLivePublish(){const ls=data.lives.filter(x=>S.createdLives.includes(x.id));return `<div class="card"><h3>4 · Publicar programación</h3><p>La transmisión creada aparecerá en el foro y calendario de demostración después de publicarse.</p>${ls.length?`<div class="demo-list">${ls.map(l=>`<div class="demo-item"><div class="row space"><b>${escapeHTML(l.title)}</b><span class="tag">${l.published?'Publicado':'Borrador'}</span></div><p>${escapeHTML(l.date)} · ${escapeHTML(l.time)} · ${escapeHTML(l.speaker)}</p><div class="toolbar">${l.published?`<button class="btn alt sm" onclick="teacherSwitch('liveStart')">Ir a sala de transmisión →</button>`:`<button class="btn sm" onclick="publishLive('${l.id}')">Publicar programación</button>`}</div></div>`).join('')}</div>`:'<div class="empty">Todavía no creaste una programación. Comenzá en «Programar en vivo».</div>'}</div>`}
function teacherLiveStart(){const ls=data.lives.filter(x=>S.createdLives.includes(x.id)&&x.published);return `<div class="card"><h3>5 · Preparar e iniciar transmisión</h3><p>Probá el procedimiento de transmisión: verificar sala, iniciar, ingresar y finalizar. La cámara y el micrófono son solo controles de simulación.</p>${ls.length?`<div class="demo-list">${ls.map(l=>`<div class="demo-item"><div class="row space"><b>${escapeHTML(l.title)}</b><span class="tag ${l.status==='live'?'status-live':'status-published'}">${l.status==='live'?'🔴 En vivo':l.status==='finished'?'Finalizado':'Programado'}</span></div><p>🎥 Cámara de prueba: preparada · 🎙 Micrófono de prueba: preparado</p><div class="toolbar">${l.status==='future'?`<button class="btn" onclick="startLive('${l.id}')">▶ Iniciar en vivo</button>`:l.status==='live'?`<button class="btn alt" onclick="navigate('lives','${l.id}')">Abrir sala y chat →</button><button class="btn" onclick="finishLive('${l.id}')">■ Finalizar</button>`:'<span class="small">Transmisión de demostración finalizada.</span>'}</div></div>`).join('')}</div>`:'<div class="empty">Publicá primero una transmisión para poder iniciarla.</div>'}</div>`}
function adminEnrollment(){let courses=data.courses.filter(c=>c.published!==false);return `<div class="card"><h3>6 · Inscribir estudiantes (administración)</h3><p>Este formulario representa el procedimiento del administrador: elegir curso, identificar al alumno de prueba y confirmar la inscripción.</p>${S.role==='admin'?`<form onsubmit="return enrollStudent(this)"><div class="workflow-fields"><div class="field wide"><label>Curso autorizado *</label><select name="course" required>${courses.map(c=>`<option value="${c.id}">${escapeHTML(c.title)}</option>`).join('')}</select></div><div class="field"><label>Nombre ficticio *</label><input required name="student" placeholder="Ej.: Lucía Estudiante" maxlength="80"></div><div class="field"><label>Matrícula ficticia *</label><input required name="code" placeholder="Ej.: DEMO-2026-01" maxlength="40"></div></div><div class="toolbar"><button class="btn" type="submit">Confirmar inscripción</button></div></form>`:`<div class="notice">Solo el rol administrador puede inscribir estudiantes. Cambiá de rol desde «Salir» y luego elegí «Administrador universitario».</div>`}<div class="section-head" style="margin-top:21px"><h3>Inscripciones realizadas en esta demo</h3></div>${S.enrollments.length?`<div class="demo-list">${S.enrollments.map(e=>`<div class="demo-item"><b>${escapeHTML(e.student)}</b><div class="small">${escapeHTML(e.code)} · ${escapeHTML(e.course)}</div></div>`).join('')}</div>`:'<div class="empty">Todavía no hay inscripciones nuevas.</div>'}</div>`}
function teacherPage(){const tabs=[['course','1. Crear curso'],['publish','2. Publicar curso'],['live','3. Programar vivo'],['livePublish','4. Publicar vivo'],['liveStart','5. Iniciar vivo'],['enroll','6. Inscribir alumno']];const steps=[['Completar ficha de curso','Guardar borrador con información de prueba'],['Revisar publicación','Publicar el curso y encontrarlo en su directorio'],['Programar conferencia','Establecer disertante, fecha, hora y área'],['Publicar el en vivo','Hacer visible su programación'],['Iniciar transmisión','Probar sala, chat y finalización'],['Inscribir un alumno','Realizar la inscripción desde el rol administrador']];let content={course:teacherCourseForm,publish:teacherPublishCourse,live:teacherLiveForm,livePublish:teacherLivePublish,liveStart:teacherLiveStart,enroll:adminEnrollment}[S.teacherStep]();return `<div class="pagehead"><span class="eyebrow">Recorrido interactivo · Novedad versión 1.1</span><h1>Sector del profesor y procesos administrativos</h1><p>Experimentá los pasos de publicación académica, transmisiones e inscripción usando datos ficticios. Los cambios se reflejan en el resto de la demo.</p></div><div class="notice"><b>Modo demostración:</b> ${S.role==='admin'?'Administrador universitario':'Docente universitario'}. Los controles no activan cámaras reales, no envían invitaciones y no registran estudiantes auténticos.</div><div class="workflow-tabs">${tabs.map(t=>`<button class="${S.teacherStep===t[0]?'selected':''}" onclick="teacherSwitch('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="workflow-layout"><div>${content}</div><div><div class="card"><h3>🧭 Procedimiento completo</h3><div class="steps">${steps.map((st,i)=>`<div class="step"><span class="step-num">${i+1}</span><div><b>${st[0]}</b><div class="small">${st[1]}</div></div></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3>Actividad de prueba</h3>${S.teacherLog.length?S.teacherLog.map(e=>`<p class="small">${escapeHTML(e.date)} · ${escapeHTML(e.text)}</p>`).join(''):'<p>Aún no registraste acciones. Creá un curso para comenzar.</p>'}</div></div></div>`}

function render(){let content=S.page==='home'?home():S.page==='articles'&&S.chosen?articleDetail():S.page==='courses'&&S.chosen?courseDetail():S.page==='recordings'?recordingPage():S.page==='lives'&&S.chosen?liveDetail():S.page==='admin'?adminPage():S.page==='teacher'?teacherPage():S.page==='school'?schoolPage():directory(S.page);let navs=[['home','⌂','Inicio'],['articles','▤','Artículos'],['courses','▧','Cursos'],['events','▦','Calendario'],['lives','◉','En vivos'],['recordings','▣','Grabaciones']];document.getElementById('app').innerHTML=`<div class="shell"><aside><div class="brand"><span class="mark">✦</span><div>ARANDUVA<small>CONOCIMIENTO COMPARTIDO</small></div></div><div class="nav-label">Explorar</div>${navs.map(n=>`<button class="nav ${S.page===n[0]?'active':''}" onclick="navigate('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<div class="nav-label">Institucional</div><button class="nav ${S.page==='teacher'?'active':''}" onclick="navigate('teacher')"><span>✎</span>Sector docente</button><button class="nav ${S.page==='admin'?'active':''}" onclick="navigate('admin')"><span>⚙</span>Administración</button><button class="nav ${S.page==='school'?'active':''}" onclick="navigate('school')"><span>🏫</span>Coordinación escolar</button><div class="sidefoot">✦ PROTOTIPO DE CONCURSO<br>Contenido y permisos simulados.<br>No conectado a universidades reales.</div></aside><div class="main"><header class="topbar"><div class="crumb">ARANDUVA / <b>${routes[S.page]||'Inicio'}</b></div><div class="top-actions"><span class="tag navy">DEMO 1.1</span>${S.role?`<span class="small" style="max-width:180px">${roleLabel()}</span><button class="btn alt sm" onclick="logout()">Salir</button>`:`<button class="btn sm" onclick="openLogin()">Acceso institucional</button>`}</div></header><div class="mobile-nav">${navs.map(n=>`<button class="chip" onclick="navigate('${n[0]}')">${n[2]}</button>`).join('')}<button class="chip" onclick="navigate('teacher')">Docentes</button><button class="chip" onclick="navigate('admin')">Administración</button><button class="chip" onclick="navigate('school')">Colegios</button></div><main class="container">${content}<div class="footer">ARANDUVA © Demo conceptual 2026 · Código abierto previsto · Datos ilustrativos · Paleta: #2A3666 · #2F9DAD · #3DB8AA · #5EC69E · #84CA94</div></main></div></div>${mainuUI()}${modal()}`};
const h=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/);if(h&&routes[h[1]]){S.page=h[1];S.chosen=h[2]||null;if(!['home','articles'].includes(S.page)){S.returnTo={page:S.page,id:S.chosen};S.page='home';S.chosen=null;S.modal='login'}}render();
</script></body></html>
