-width:620px){.hero{flex-direction:column;align-items:flex-start}.hero-bird{align-self:center}.grid,.grid.two,.live-layout{grid-template-columns:1fr}.topbar{height:62px}.topbar .crumb{display:none}.section-head h2{font-size:20px}.pagehead h1{font-size:27px}.roles{grid-template-columns:1fr}.mainu-launch{right:15px;bottom:15px}.mainu-chat{right:12px;bottom:95px}.filterbar{display:grid;grid-template-columns:1fr 1fr}.filterbar .field:first-child{grid-column:span 2}}
</style></head><body><div id="app"></div><script>
const C={navy:'#2A3666',turq:'#2F9DAD',teal:'#3DB8AA',emerald:'#5EC69E',mint:'#84CA94'};
const data={articles:[{id:'a1',title:'Tecnologías abiertas y educación superior',author:'Ana Ruiz',univ:'Universidad Demo del Este',area:'Tecnología',city:'Ciudad del Este',date:'2026-10-27',views:432,kind:'Artículo de revisión',summary:'Un recorrido por el uso de tecnologías abiertas para compartir conocimiento entre universidades.',body:'Las tecnologías abiertas facilitan que las instituciones educativas compartan herramientas y materiales sin depender exclusivamente de proveedores privados. La colaboración entre docentes y estudiantes puede mejorar el acceso a experiencias educativas diversas. Sin embargo, la sostenibilidad requiere planificación técnica, recursos humanos y una gobernanza transparente. Las universidades pueden comenzar con pilotos pequeños, medir resultados y ampliar el acceso de manera progresiva.'},{id:'a2',title:'Mediación cultural y participación comunitaria',author:'Lucía Vera',univ:'Universidad Demo de Asunción',area:'Humanidades',city:'Asunción',date:'2026-10-25',views:612,kind:'Investigación cualitativa',summary:'Análisis ilustrativo de estrategias comunitarias para compartir prácticas culturales.',body:'La mediación cultural busca facilitar el encuentro entre personas, instituciones y expresiones culturales. Las experiencias comunitarias muestran la importancia de escuchar a quienes participan y construir actividades con su colaboración. Los resultados sugieren que la participación activa permite adaptar mejor los proyectos a las necesidades locales.'},{id:'a3',title:'Gestión de pacientes en establecimientos públicos',author:'Miguel Duarte',univ:'Universidad Demo de Encarnación',area:'Salud',city:'Encarnación',date:'2026-10-28',views:319,kind:'Estudio exploratorio',summary:'Propuesta ficticia de organización de turnos y prioridades en centros de atención.',body:'La organización del recorrido del paciente puede mejorarse mediante procesos claros de admisión, priorización clínica realizada por personal sanitario y coordinación administrativa. Las herramientas digitales pueden ayudar a reducir tareas repetitivas y mejorar la continuidad de la información, pero no sustituyen el criterio del equipo de salud.'},{id:'a4',title:'Biodiversidad del Paraguay y ciencia ciudadana',author:'Sofía Benítez',univ:'Universidad Demo del Norte',area:'Ciencias naturales',city:'Concepción',date:'2026-10-20',views:745,kind:'Artículo divulgativo',summary:'Cómo los registros comunitarios pueden ayudar a ampliar el conocimiento de la fauna local.',body:'La ciencia ciudadana permite colaborar en proyectos de observación y registro de biodiversidad. Con capacitación y verificación, las observaciones pueden complementar proyectos académicos y fortalecer el interés por la conservación.'}],courses:[{id:'c1',title:'Introducción a la inteligencia artificial',area:'Tecnología',city:'Asunción',univ:'Universidad Demo de Asunción',enrolled:420,views:860,teacher:'Dra. Camila López',level:'Universitario'},{id:'c2',title:'Metodologías de investigación social',area:'Humanidades',city:'Ciudad del Este',univ:'Universidad Demo del Este',enrolled:320,views:710,teacher:'Prof. Diego Silva',level:'Universitario'},{id:'c3',title:'Fundamentos de salud pública',area:'Salud',city:'Encarnación',univ:'Universidad Demo de Encarnación',enrolled:270,views:620,teacher:'Dra. Elena Torres',level:'Universitario'},{id:'c4',title:'Programación desde cero',area:'Tecnología',city:'Ciudad del Este',univ:'Universidad Demo del Este',enrolled:255,views:560,teacher:'Ing. Pablo Rojas',level:'Nivel medio'}],events:[{id:'e1',title:'Seminario de inteligencia artificial aplicada',date:'2026-11-05',time:'16:00',area:'Tecnología',city:'Asunción',speaker:'Dra. Camila López',univ:'Universidad Demo de Asunción'},{id:'e2',title:'Encuentro de mediación cultural',date:'2026-11-07',time:'10:00',area:'Humanidades',city:'Ciudad del Este',speaker:'Prof. Diego Silva',univ:'Universidad Demo del Este'},{id:'e3',title:'Mesa de trabajo: salud y gestión pública',date:'2026-11-09',time:'18:00',area:'Salud',city:'Encarnación',speaker:'Dra. Elena Torres',univ:'Universidad Demo de Encarnación'}],lives:[{id:'l1',title:'La investigación abierta en Paraguay',speaker:'Dra. Camila López',area:'Tecnología',city:'Asunción',status:'live',time:'Ahora',viewers:128},{id:'l2',title:'Diálogo sobre mediación cultural',speaker:'Prof. Diego Silva',area:'Humanidades',city:'Ciudad del Este',status:'soon',time:'En 10 minutos',viewers:0},{id:'l3',title:'Innovación en gestión hospitalaria',speaker:'Dra. Elena Torres',area:'Salud',city:'Encarnación',status:'future',time:'Mañana 18:00',viewers:0}],recordings:[{id:'r1',title:'Aprender con inteligencia artificial',speaker:'Dra. Camila López',area:'Tecnología',city:'Asunción',views:615,minutes:32},{id:'r2',title:'Cultura y territorio',speaker:'Prof. Diego Silva',area:'Humanidades',city:'Ciudad del Este',views:302,minutes:48}]};
const routes={home:'Inicio',articles:'Artículos',courses:'Cursos',events:'Calendario',lives:'En vivos',recordings:'Grabaciones',admin:'Administración',school:'Coordinación escolar'};
let S={page:'home',role:null,modal:null,returnTo:null,chosen:null,filters:{},chatOpen:false,mainuMood:'idle',mainuMessages:[{who:'ai',text:'¡Hola! Soy Mainu 🐦. Puedo ayudarte a encontrar artículos, entender un curso o citar fuentes. ¿Qué te gustaría saber?'}],liveComments:[{who:'Moderación',text:'Bienvenidos a la transmisión de demostración. 📌',pin:true},{who:'Estudiante demo',text:'¿Dónde encontramos los materiales del encuentro?'},{who:'Invitada especial',text:'Compartiremos las referencias al finalizar.',guest:true}],requests:0,approved:false,sub:'es',playing:false,modalContext:null};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bird=(m='idle')=>`<svg class="bird ${m}" viewBox="0 0 200 170" aria-label="Mainu, colibrí asistente" role="img"><g class="wing-left"><path d="M81 88Q10 53 23 12Q48 33 82 61Z" fill="${C.turq}"/><path d="M81 85Q15 81 20 37Q45 54 88 70Z" fill="${C.teal}"/><path d="M78 83Q29 91 35 60Q60 62 91 79Z" fill="${C.navy}"/></g><g class="wing-right"><path d="M115 79Q145 11 181 19Q165 64 119 99Z" fill="${C.navy}"/><path d="M120 83Q155 28 188 49Q166 81 121 99Z" fill="${C.turq}"/><path d="M125 87Q164 62 184 81Q151 110 124 109Z" fill="${C.mint}"/></g><path d="M83 124Q55 144 30 158Q59 155 90 147Z" fill="${C.navy}"/><path d="M94 126Q85 152 77 166Q100 154 112 137Z" fill="${C.turq}"/><ellipse cx="103" cy="99" rx="42" ry="43" fill="${C.emerald}"/><ellipse cx="113" cy="111" rx="28" ry="30" fill="#f8fffd"/><circle cx="108" cy="61" r="33" fill="${C.teal}"/><path d="M81 56Q95 27 121 32Q103 41 95 59" fill="${C.mint}"/><path d="M133 65L190 76 133 78Z" fill="${C.navy}"/>${m==='sad'?'<path d="M95 67q9-7 18 0" fill="none" stroke="#243654" stroke-width="4"/><circle cx="104" cy="73" r="5" fill="#243654"/>':m==='happy'?'<path d="M95 69q10 12 21 0" fill="none" stroke="#263451" stroke-width="4" stroke-linecap="round"/>':'<circle cx="106" cy="67" r="9" fill="#243654"/><circle cx="109" cy="64" r="3" fill="white"/>'}<circle cx="86" cy="86" r="5" fill="#f7b6b4"/><path d="M93 139q-8 11-14 2M109 141q-2 10-9 5" stroke="${C.navy}" stroke-width="4" stroke-linecap="round" fill="none"/></svg>`;
function navigate(page,id){const restricted=['courses','events','lives','recordings','admin','school'];if(restricted.includes(page)&&!S.role){S.returnTo={page,id};S.modal='login';render();return}if(page==='admin'&&S.role!=='admin'){toast('Entrá como administrador en el selector de roles');return}if(page==='school'&&S.role!=='coordinator'&&S.role!=='admin'){toast('Acceso exclusivo para coordinación escolar');return}S.page=page;S.chosen=id||null;S.filters={};S.mainuMood='interested';history.replaceState({},'',`#/${page}${id?'/'+id:''}`);render();window.scrollTo(0,0)};
function setRole(r){S.role=r;S.modal=null;let next=S.returnTo;S.returnTo=null;toast('Sesión de demostración: '+roleLabel());if(next)navigate(next.page,next.id);else render()};function roleLabel(){return {admin:'Administrador universitario',student:'Estudiante universitario',coordinator:'Coordinador escolar',schoolstudent:'Estudiante escolar',listener:'Oyente'}[S.role]||'Visitante'};
function openLogin(){S.modal='login';render()};function logout(){S.role=null;navigate('home');toast('Saliste de la sesión de demostración')};let T;function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:#2A3666;color:#fff;padding:12px 18px;border-radius:12px;z-index:200;box-shadow:0 8px 30px #0003;max-width:90vw';document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(T);T=setTimeout(()=>el.hidden=true,2900)};
function cardArticle(a){return `<article class="card"><span class="tag">${escapeHTML(a.area)}</span><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.summary)}</p><div class="meta">✍️ ${escapeHTML(a.author)} · 👁 ${a.views} lecturas</div><button class="link" onclick="navigate('articles','${a.id}')">Leer artículo ↗</button></article>`};function courseCard(c){return `<article class="card"><div class="thumb">${c.area==='Salud'?'🩺':c.area==='Tecnología'?'💻':'📖'}</div><div class="meta"><span class="tag">${escapeHTML(c.area)}</span><span>👁 ${c.views}</span></div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.teacher)}<br>${escapeHTML(c.univ)}</p><button class="btn alt sm" onclick="navigate('courses','${c.id}')">Explorar curso →</button></article>`};function liveCard(l){return `<article class="card"><span class="tag ${l.status==='live'?'live':l.status==='soon'?'soon':''}">${l.status==='live'?'🔴 En vivo':l.status==='soon'?'⏰ En 10 minutos':'📆 Programado'}</span><h3>${escapeHTML(l.title)}</h3><p>🎙 ${escapeHTML(l.speaker)}<br>📍 ${escapeHTML(l.city)}</p><button class="btn sm" onclick="navigate('lives','${l.id}')">${l.status==='live'?'Entrar al vivo':'Ver detalles'} →</button></article>`};
function home(){return `<div class="hero"><div><div style="text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#bbede5;font-weight:800">Conocimiento abierto · conexiones reales</div><h1>El conocimiento crece cuando lo compartimos.</h1><p>ARANDUVA conecta investigación, cursos y encuentros entre universidades y colegios. Mainu te acompaña en cada descubrimiento.</p><div class="toolbar"><button class="btn" onclick="navigate('articles')">Explorar investigaciones ↗</button><button class="btn alt" onclick="toggleMainu(true)">Conocer a Mainu 🐦</button></div></div><div class="hero-bird">${bird()}</div></div><div class="section"><div class="section-head"><h2>✦ Novedades</h2><span class="small">Actualización automática · demostración</span></div><div class="grid">${[data.articles[2],data.articles[0],data.articles[1]].map(cardArticle).join('')}</div></div><div class="section"><div class="section-head"><h2>🎓 Cursos populares</h2><button class="link" onclick="navigate('courses')">Ver todos →</button></div><p class="small">Ranking semanal simulado, basado en actividad y visualizaciones únicas.</p><div class="grid">${[...data.courses].sort((a,b)=>b.views-a.views).slice(0,3).map(courseCard).join('')}</div></div><div class="section"><div class="section-head"><h2>📡 En vivos</h2><button class="link" onclick="navigate('lives')">Ver programación →</button></div><p class="small">Primero lo que comienza en 10 minutos, luego los vivos activos y después los programados.</p><div class="grid">${[...data.lives].sort((a,b)=>({soon:0,live:1,future:2}[a.status]-{soon:0,live:1,future:2}[b.status])).map(liveCard).join('')}</div></div><div class="section"><div class="section-head"><h2>📚 Artículos científicos</h2><button class="link" onclick="navigate('articles')">Biblioteca abierta →</button></div><div class="grid two"><div class="card"><span class="tag">Más leído</span>${cardMini(data.articles[3])}</div><div class="card"><span class="tag">Recién publicado</span>${cardMini(data.article function filterUI(kind){let fields=kind==='articles'?['Buscar artículo o autor','Área','Ciudad','Ordenar']:kind==='courses'?['Buscar curso o docente','Área','Ciudad','Ordenar']:kind==='events'?['Buscar evento o disertante','Área','Ciudad','Ordenar']:['Buscar transmisión','Área','Ciudad','Ordenar'];let areas=['Todas las áreas','Tecnología','Humanidades','Salud','Ciencias naturales'];let cities=['Todas las ciudades','Asunción','Ciudad del Este','Encarnación','Concepción'];return `<div class="filterbar"><div class="field"><label>${fields[0]}</label><input id="fsearch" placeholder="Buscar..." value="${escapeHTML(S.filters.search||'')}" oninput="updateFilter('search',this.value)"></div><div class="field"><label>${fields[1]}</label><select onchange="updateFilter('area',this.value)">${areas.map((x,i)=>`<option value="${i?x:''}" ${S.filters.area===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${fields[2]}</label><select onchange="updateFilter('city',this.value)">${cities.map((x,i)=>`<option value="${i?x:''}" ${S.filters.city===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${fields[3]}</label><select onchange="updateFilter('order',this.value)"><option value="recent">Más recientes</option><option value="popular" ${S.filters.order==='popular'?'selected':''}>Más populares</option><option value="az" ${S.filters.order==='az'?'selected':''}>Título A–Z</option></select></div></div>`};function updateFilter(k,v){S.filters[k]=v;const dest=document.getElementById('filtered');if(dest)dest.innerHTML=filteredContent(S.page)};function getFiltered(kind){let arr=[...(data[kind]||[])];return arr.filter(x=>(!S.filters.area||x.area===S.filters.area)&&(!S.filters.city||x.city===S.filters.city)&&(!S.filters.search||JSON.stringify(x).toLowerCase().includes(S.filters.search.toLowerCase()))).sort((a,b)=>S.filters.order==='popular'?(b.views||b.enrolled||0)-(a.views||a.enrolled||0):S.filters.order==='az'?a.title.localeCompare(b.title):(b.date||'').localeCompare(a.date||''))};function filteredContent(kind){const items=getFiltered(kind);return items.length?`<div class="grid">${items.map(x=>kind==='articles'?cardArticle(x):kind==='courses'?courseCard(x):kind==='events'?`<div class="card"><span class="tag">${x.date} · ${x.time}</span><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.speaker)} · ${escapeHTML(x.city)}</p><button class="btn alt sm" onclick="toast('Evento agregado al calendario demostrativo')">Añadir recordatorio ♡</button></div>`:liveCard(x)).join('')}</div>`:'<div class="empty">Mainu no encontró resultados con esos filtros. Probá otra combinación. 🐦</div>'};
function directory(kind){let config={articles:['Biblioteca científica','Investigaciones abiertas a toda la comunidad. Referencias en formato APA 7.'],courses:['Directorio de cursos','Formación académica autorizada para usuarios institucionales.'],events:['Calendario académico','Conferencias, encuentros y actividades universitarias.'],lives:['Foro de en vivos','Encuentros académicos con chat y participación regulada.']}[kind];return `<div class="pagehead"><span class="eyebrow">ARANDUVA / Explorador</span><h1>${config[0]}</h1><p>${config[1]}</p></div>${filterUI(kind)}<div class="small" style="margin:10px 0">Contenido ilustrativo · Podés combinar filtros y ordenar resultados.</div><div id="filtered">${filteredContent(kind)}</div>`};
function articleDetail(){const a=data.articles.find(x=>x.id===S.chosen)||data.articles[0];const cite=`${a.author.split(' ').slice(-1)[0]}, ${a.author[0]}. (2026). ${a.title}. Repositorio de demostración ARANDUVA.`;return `<button class="back" onclick="navigate('articles')">← Volver a artículos</button><div class="pagehead"><span class="tag">${escapeHTML(a.area)} · Ficticio</span><h1 style="margin-top:14px">${escapeHTML(a.title)}</h1><p>${escapeHTML(a.author)} · ${escapeHTML(a.univ)} · ${a.date}</p></div><div class="card articlebody"><p><b>Resumen:</b> ${escapeHTML(a.summary)}</p><h2>Introducción</h2><p class="highlightable">${escapeHTML(a.body)}</p><h2>Conclusión</h2><p class="highlightable">Este texto es exclusivamente una muestra diseñada para enseñar cómo un estudiante podría leer, seleccionar y comprender una investigación con ayuda de Mainu.</p><div class="notice" style="margin-top:20px"><b>Referencia APA 7 (demostrativa)</b><p id="apacite">${escapeHTML(cite)}</p><button class="btn sm" onclick="copyText(document.getElementById('apacite').innerText)">Copiar referencia</button></div><div class="toolbar"><button class="btn alt" onclick="toggleMainu(true);askMainu('Explicame este artículo de forma sencilla')">🐦 Explicame con Mainu</button><button class="btn alt" onclick="toggleMainu(true);askMainu('¿Cómo cito este artículo en APA 7?')">Ayuda con APA</button></div></div><div class="section"><div class="section-head"><h2>Artículos relacionados</h2></div><div class="grid two">${data.articles.filter(x=>x.id!==a.id).slice(0,2).map(cardArticle).join('')}</div></div>`};

function renderComment(x){return `<div class="chatmsg ${x.guest?'guest':''} ${x.pin?'pin':''}"><strong>${x.pin?'📌 ':''}${escapeHTML(x.who)}</strong><div>${escapeHTML(x.text)}</div>${S.role==='admin'||S.role==='listener'?`<button class="link" style="font-size:11px;padding:1px" onclick="pinComment(${S.liveComments.indexOf(x)})">${x.pin?'Desanclar':'Anclar'}</button>`:''}</div>`};function pinComment(i){S.liveComments[i].pin=!S.liveComments[i].pin;render()};function sendChat(){const input=document.getElementById('chat-input');let val=input?.value.trim();if(!val)return;S.liveComments.push({who:roleLabel(),text:val,guest:S.role==='listener'&&S.requests<0});render()};function liveDetail(){let l=data.lives.find(x=>x.id===S.chosen)||data.lives[0];return `<button class="back" onclick="navigate('lives')">← Programación de en vivos</button><div class="pagehead"><span class="tag ${l.status==='live'?'live':'soon'}">${l.status==='live'?'🔴 En vivo':l.time}</span><h1 style="margin-top:12px">${escapeHTML(l.title)}</h1><p>${escapeHTML(l.speaker)} · ${escapeHTML(l.city)} · Demostración</p></div><div class="live-layout"><div><div class="video"><div><div style="font-size:49px">🎥</div><h3>Transmisión simulada</h3><p style="color:#d2e9ee">${escapeHTML(l.speaker)} · Sala de prueba</p><button class="btn alt sm" onclick="S.playing=!S.playing;render()">${S.playing?'⏸ Pausar':'▶ Iniciar'} ejemplo</button></div><div class="subtitles">${S.sub==='es'?'Bienvenidos a este encuentro académico.':'Bem-vindos a este encontro acadêmico.'}</div></div><div class="toolbar"><label class="small">Subtítulos:</label><button class="chip" onclick="S.sub='es';render()">ES</button><button class="chip" onclick="S.sub='pt';render()">PT</button><button class="chip" onclick="toggleMainu(true);askMainu('¿Qué explicó la ponente en este video?')">🐦 Preguntale a Mainu</button></div><div class="card"><h3>Participación</h3><div class="toolbar">${S.role==='admin'?`<button class="btn sm" onclick="inviteGuest()">🔗 Generar invitación</button><button class="btn alt sm" onclick="approveRequest()">✅ Aprobar solicitud (${S.requests})</button><button class="btn alt sm" onclick="S.modal='summary';render()">⏹ Finalizar vivo</button>`:`<button class="btn alt sm" onclick="S.requests++;toast('Solicitud enviada al administrador (simulación)')">✋ Solicitar intervenir</button>`}</div><p class="small">Los estudiantes participan solo por chat. Los invitados audiovisuales requieren autorización administrativa.</p></div></div><div class="card"><div class="row space"><h3>Chat en vivo</h3><span class="tag live">Demo</span></div><div class="chatlog" id="chat-scroll">${S.liveComments.map(renderComment).join('')}</div><div class="row"><input class="input" id="chat-input" placeholder="Escribí un comentario" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">Enviar</button></div><p class="small">Mensajes ficticios, visibles únicamente durante la simulación.</p></div></div>`};function inviteGuest(){let url=location.origin+location.pathname+'#/invitado-demo';copyText(url);toast('Enlace de demostración copiado. No otorga permisos reales.')};function approveRequest(){if(!S.requests){toast('Todavía no hay solicitudes pendientes');return}S.requests--;S.liveComments.push({who:'Oyente promovido · Invitado',text:'¡Gracias por habilitar mi participación!',guest:true});toast('Solicitud aprobada · cámara y micrófono simulados');render()};

function modal(){if(!S.modal)return '';if(S.modal==='login')return `<div class="modal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal"><button class="modal-close" onclick="S.modal=null;render()">✕</button><h2>🔒 Acceso institucional</h2><p class="small">Elegí un rol de prueba. La demo no necesita cédula, matrícula ni contraseña auténtica.</p><div class="roles">${[['student','🎓 Estudiante universitario'],['admin','🛡️ Administrador universitario'],['coordinator','🏫 Coordinador de colegio'],['schoolstudent','📖 Estudiante de colegio'],['listener','🎧 Oyente autenticado']].map(x=>`<button class="role" onclick="setRole('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="notice">Todos los accesos son ficticios. Los permisos reales requieren autenticación segura en una implementación futura.</div></div></div>`;if(S.modal==='summary')return `<div class="modal-bg"><div class="modal"><button class="modal-close" onclick="S.modal=null;render()">✕</button><h2>📄 Revisión académica</h2><p class="small">Borrador simulado producido por IA.</p><div class="card" style="margin:15px 0"><b>Resumen: investigación abierta</b><p>Se conversó sobre el acceso a contenidos universitarios, la importancia de citar fuentes y la cooperación entre instituciones. Se recomendó evaluar los resultados antes de ampliar el sistema.</p><b>Preguntas agrupadas:</b><p>1. ¿Cómo se publican materiales?<br>2. ¿Quién puede acceder a grabaciones?<br>3. ¿Cómo se verifican fuentes?</p></div><label><input type="checkbox" id="summary-check"> Revisé el contenido y autorizo su publicación.</label><div class="toolbar"><button class="btn" onclick="if(document.getElementById('summary-check').checked){S.approved=true;S.modal=null;render();toast('Resumen de ejemplo aprobado')}else toast('Primero revisá y marcá la autorización')">Publicar resumen</button><button class="btn alt" onclick="S.modal=null;render()">Cancelar</button></div></div></div>`;return ''};
function mainuReply(q){let s=q.toLowerCase();let art=data.articles.find(x=>S.page==='articles'&&x.id===S.chosen);if(s.includes('citar')||s.includes('apa'))return art?`Para citar este artículo de demostración, podés utilizar sus datos: ${art.author} (2026), «${art.title}». Recordá comprobar los metadatos antes de usar cualquier referencia en una investigación real.`:'Para citar un artículo en APA 7 necesitás autor, año, título y fuente. Abrí un artículo de la biblioteca y te muestro un ejemplo con sus datos.';if(s.includes('video')||s.includes('grabación')||s.includes('ponente'))return 'En nuestra grabación de ejemplo se explica que la tecnología puede acompañar el aprendizaje. Cuando conectemos transcripciones reales, podré señalar el minuto exacto de cada explicación.';if(s.includes('curso'))return 'Podés entrar al directorio de cursos desde el menú. Allí filtrás por carrera, área o ciudad. Si querés, empezá por «Introducción a la inteligencia artificial».';if(s.includes('resum')||s.includes('explic')||s.includes('entender'))return art?`¡Claro! Este artículo trata sobre ${art.title.toLowerCase()}. En palabras simples: ${art.summary} No olvides que este artículo es ficticio y se utiliza para mostrar cómo te acompañaría.`:'¡Claro! La idea principal del ejemplo es que compartir materiales académicos ayuda a que más personas aprendan. Puedo explicar un párrafo específico si abrís un artículo.';if(s.includes('artículo')||s.includes('investiga')||s.includes('buscar'))return 'La biblioteca científica es abierta. Podés buscar por autor, área, ciudad o título. Como ejemplo, te recomiendo explorar los artículos sobre tecnología y educación.';return '¡Buena pregunta! 🐦 Soy Mainu en versión demostrativa, así que por ahora respondo con ejemplos preparados. En la versión oficial podré consultar artículos y transcripciones reales, respetando tus permisos. Probá preguntarme por cursos, artículos o citas APA.'};function askMainu(q){S.mainuMessages.push({who:'user',text:q});S.mainuMood='thinking';render();setTimeout(()=>{S.mainuMessages.push({who:'ai',text:mainuReply(q)});S.mainuMood='happy';render();let z=document.querySelector('.mainu-body');if(z)z.scrollTop=z.scrollHeight},320)};function submitMainu(){let i=document.getElementById('mainu-input');if(i&&i.value.trim())askMainu(i.value.trim())};function toggleMainu(v){S.chatOpen=typeof v==='boolean'?v:!S.chatOpen;render()};function mainuUI(){return `<button class="mainu-launch" aria-label="Abrir asistente Mainu" onclick="toggleMainu()">${bird(S.mainuMood)}</button>${S.chatOpen?`<div class="mainu-chat"><div class="mainu-head">${bird(S.mainuMood)}<div style="flex:1"><b>Mainu</b><div style="font-size:11px;color:#bbeddf">Tu compañero académico · Demo</div></div><button style="background:none;color:white;border:0;font-size:22px" onclick="toggleMainu(false)">×</button></div><div class="mainu-body">${S.mainuMessages.map(m=>`<div class="bubble ${m.who==='ai'?'ai':'user'}">${escapeHTML(m.text)}</div>`).join('')}<div class="pillrow" style="margin-top:12px"><button class="chip" onclick="askMainu('Explicame este contenido')">Explicame</button><button class="chip" onclick="askMainu('¿Cómo cito en APA?')">Citar en APA</button><button class="chip" onclick="askMainu('Buscá artículos')">Buscar artículos</button></div></div><div class="mainu-compose"><input class="input" id="mainu-input" placeholder="Preguntale a Mainu..." onkeydown="if(event.key==='Enter')submitMainu()"><button class="btn sm" onclick="submitMainu()">➤</button></div></div>`:''}`};function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Copiado al portapapeles')).catch(()=>toast('No se pudo copiar automáticamente'))}else{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Copiado al portapapeles')}};
function render(){let content=S.page==='home'?home():S.page==='articles'&&S.chosen?articleDetail():S.page==='courses'&&S.chosen?courseDetail():S.page==='recordings'?recordingPage():S.page==='lives'&&S.chosen?liveDetail():S.page==='admin'?adminPage():S.page==='school'?schoolPage():directory(S.page);let navs=[['home','⌂','Inicio'],['articles','▤','Artículos'],['courses','▧','Cursos'],['events','▦','Calendario'],['lives','◉','En vivos'],['recordings','▣','Grabaciones']];document.getElementById('app').innerHTML=`<div class="shell"><aside><div class="brand"><span class="mark">✦</span><div>ARANDUVA<small>CONOCIMIENTO COMPARTIDO</small></div></div><div class="nav-label">Explorar</div>${navs.map(n=>`<button class="nav ${S.page===n[0]?'active':''}" onclick="navigate('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<div class="nav-label">Institucional</div><button class="nav ${S.page==='admin'?'active':''}" onclick="navigate('admin')"><span>⚙</span>Administración</button><button class="nav ${S.page==='school'?'active':''}" onclick="navigate('school')"><span>🏫</span>Coordinación escolar</button><div class="sidefoot">✦ PROTOTIPO DE CONCURSO<br>Contenido y permisos simulados.<br>No conectado a universidades reales.</div></aside><div class="main"><header class="topbar"><div class="crumb">ARANDUVA / <b>${routes[S.page]||'Inicio'}</b></div><div class="top-actions"><span class="tag navy">DEMO 1.0</span>${S.role?`<span class="small" style="max-width:180px">${roleLabel()}</span><button class="btn alt sm" onclick="logout()">Salir</button>`:`<button class="btn sm" onclick="openLogin()">Acceso institucional</button>`}</div></header><div class="mobile-nav">${navs.map(n=>`<button class="chip" onclick="navigate('${n[0]}')">${n[2]}</button>`).join('')}<button class="chip" onclick="navigate('admin')">Administración</button><button class="chip" onclick="navigate('school')">Colegios</button></div><main class="container">${content}<div class="footer">ARANDUVA © Demo conceptual 2026 · Código abierto previsto · Datos ilustrativos · Paleta: #2A3666 · #2F9DAD · #3DB8AA · #5EC69E · #84CA94</div></main></div></div>${mainuUI()}${modal()}`};
const h=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/);if(h&&routes[h[1]]){S.page=h[1];S.chosen=h[2]||null;if(!['home','articles'].includes(S.page)){S.returnTo={page:S.page,id:S.chosen};S.page='home';S.chosen=null;S.modal='login'}}render();
</script></body></html>
